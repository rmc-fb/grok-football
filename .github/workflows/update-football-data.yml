name: Update Football Schedule from Apify

on:
  schedule:
    - cron: '0 9 * * *'     # 毎日9時JST頃
  workflow_dispatch:

jobs:
  scrape-and-clean:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Apify Actor
        id: run-actor
        run: |
          curl -X POST \
            "https://api.apify.com/v2/actor-runs?token=${{ secrets.APIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "actorId": "azzouzana/sofascore-scraper-pro",
              "input": {
                "startUrls": [
                  "https://www.sofascore.com/football/premier-league",
                  "https://www.sofascore.com/football/bundesliga",
                  "https://www.sofascore.com/football/la-liga",
                  "https://www.sofascore.com/football/serie-a",
                  "https://www.sofascore.com/football/ligue-1"
                ],
                "maxItems": 300
              }
            }' > run_response.json

          echo "RUN_ID=$(jq -r '.data.id' run_response.json)" >> $GITHUB_ENV

      - name: Wait and Download Data
        run: |
          mkdir -p data
          sleep 30
          curl -o data/matches.json "https://api.apify.com/v2/actor-runs/${{ env.RUN_ID }}/dataset/items?token=${{ secrets.APIFY_TOKEN }}"

      - name: Clean old matches
        run: python process_data.py

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update: Cleaned football schedule"