name: Update Football Schedule from Apify

on:
  schedule:
    - cron: '30 8 * * *'     # 毎日朝8:30 JST頃
  workflow_dispatch:         # 手動実行も可能

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Apify Actor
        id: apify
        uses: apify/actor-run-action@v1
        with:
          actor: azzouzana/sofascore-scraper-pro
          token: ${{ secrets.APIFY_TOKEN }}
          input: |
            {
              "startUrls": [
                "https://www.sofascore.com/football",
                "https://www.sofascore.com/football/premier-league",
                "https://www.sofascore.com/football/bundesliga"
              ],
              "maxItems": 200
            }

      - name: Download Dataset
        run: |
          # ApifyからDatasetをダウンロード（必要に応じて調整）
          curl -o data/matches.json "https://api.apify.com/v2/actor-runs/${{ steps.apify.outputs.runId }}/dataset/items?token=${{ secrets.APIFY_TOKEN }}"

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update: Latest football matches from Sofascore"
          file_pattern: data/matches.json